<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Work Order Information Summary</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f5f5f5; padding: 20px; color: #111; }
        .container { max-width: 1400px; margin: 0 auto; background-color: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); color: white; padding: 40px 20px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 10px; font-weight: 600; }
        .header p { font-size: 14px; opacity: 0.9; margin-bottom: 20px; }
        .powered-by { font-size: 12px; opacity: 0.7; margin-top: 15px; }
        .export-info { padding: 14px 20px; border-bottom: 1px solid #e0e0e0; background: #fff; font-size: 12px; color: #555; }
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; background: white; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 980px; }
        thead { background-color: #2c3e50; color: white; }
        th { padding: 15px; text-align: left; font-weight: 600; border-right: 1px solid #34495e; white-space: nowrap; }
        th:last-child { border-right: none; }
        td { padding: 12px 15px; border-bottom: 1px solid #e0e0e0; vertical-align: top; }
        tbody tr:nth-child(even) { background-color: #f5f5f5; }
        td:nth-child(2) { font-weight: 600; color: #2c3e50; }
        .company-cell { min-width: 270px; }
        .problem-text { line-height: 1.45; max-width: 360px; }
        .address-link { color: inherit; text-decoration: none; }
        .address-link:hover { text-decoration: underline; }
        .export-note { margin-top: 8px; font-size: 12px; color: #444; }
        .empty-state { padding: 28px 20px 36px; text-align: center; color: #666; font-size: 14px; }
        .hint { padding: 14px 20px 18px; font-size: 12px; color: #666; background: white; }
        @media (max-width: 768px) { body { padding: 12px; } .container { border-radius: 10px; } .header { padding: 22px 14px; } .header h1 { font-size: 20px; line-height: 1.2; } .header p { font-size: 13px; margin-bottom: 12px; } .powered-by { font-size: 11px; } table { font-size: 12px; } th, td { padding: 10px 12px; } }
        @media (max-width: 420px) { body { padding: 10px; } .header h1 { font-size: 18px; } table { font-size: 11px; } th, td { padding: 9px 10px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Work Order Information Summary</h1>
            <div class="powered-by">Exportierte Übersicht</div>
        </div>
        <div class="export-info">0 Work Orders exportiert.</div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>✓</th>
                        <th>WO#</th>
                        <th>Callnummer</th>
                        <th>Firma (Ansprechpartner)</th>
                        <th>Telefon</th>
                        <th>Ansprechpartner Stadt (Adresse)</th>
                        <th>Gerät</th>
                        <th>Problem/Arbeit</th>
                        <th>SN</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <div class="empty-state">Noch keine Work Orders erkannt.</div>
        </div>
        <div class="hint">Adressen öffnen direkt in Google Maps.</div>
    </div>
</body>
</html>
