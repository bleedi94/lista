<!DOCTYPE html> <html lang="de"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> <title>Work Order Information Summary</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; }
text
    html {
        -webkit-text-size-adjust: 100%; /* iOS Safari: verhindert automatisches Text-Zoomen  */
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: #f5f5f5;
        padding: 20px;
        color: #111;
    }

    .container {
        max-width: 1400px;
        margin: 0 auto;
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        overflow: hidden;
    }

    .header {
        background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
        color: white;
        padding: 40px 20px;
        text-align: center;
    }

    .header h1 {
        font-size: 28px;
        margin-bottom: 10px;
        font-weight: 600;
    }

    .header p {
        font-size: 14px;
        opacity: 0.9;
        margin-bottom: 20px;
    }

    .powered-by {
        font-size: 12px;
        opacity: 0.7;
        margin-top: 15px;
    }

    .table-wrapper {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch; /* iOS Momentum-Scroll */
        overscroll-behavior-x: contain;
        background: white;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        min-width: 980px; /* erzwingt horizontales Scrollen auf Mobile */
    }

    thead {
        background-color: #2c3e50;
        color: white;
    }

    /* Hinweis: Sticky kann in iOS/Safari + overflow manchmal unzuverlässig sein  */
    @supports (position: sticky) {
        thead {
            position: sticky;
            top: 0;
            z-index: 5;
        }
    }

    th {
        padding: 15px;
        text-align: left;
        font-weight: 600;
        border-right: 1px solid #34495e;
        white-space: nowrap;
    }

    th:last-child {
        border-right: none;
    }

    td {
        padding: 12px 15px;
        border-bottom: 1px solid #e0e0e0;
        vertical-align: top;
    }

    tbody tr {
        transition: background-color 0.2s ease;
    }

    tbody tr:hover {
        background-color: #f9f9f9;
    }

    tbody tr:nth-child(even) {
        background-color: #f5f5f5;
    }

    tbody tr:nth-child(even):hover {
        background-color: #f0f0f0;
    }

    /* Column-specific styling */
    td:nth-child(1),
    th:nth-child(1) {
        font-weight: 600;
        color: #2c3e50;
    }

    td:nth-child(4),
    th:nth-child(4) {
        color: #555;
        font-size: 12px;
    }

    td:nth-child(6),
    th:nth-child(6) {
        color: #555;
        font-size: 12px;
    }

    /* Responsive */
    @media (max-width: 768px) {
        body { padding: 12px; }
        .container { border-radius: 10px; }

        .header { padding: 22px 14px; }
        .header h1 { font-size: 20px; line-height: 1.2; }
        .header p { font-size: 13px; margin-bottom: 12px; }
        .powered-by { font-size: 11px; }

        table { font-size: 12px; }
        th, td { padding: 10px 12px; }
    }

    @media (max-width: 420px) {
        body { padding: 10px; }
        .header h1 { font-size: 18px; }

        table { font-size: 11px; }
        th, td { padding: 9px 10px; }
    }
</style>
</head> <body> <div class="container"> <div class="header"> <h1>Work Order Information Summary</h1> </div>
text
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>WO#</th>
                    <th>Callnummer</th>
                    <th>Firma (Ansprechpartner)</th>
                    <th>Telefon</th>
                    <th>Ansprechpartner Stadt (Adresse)</th>
                    <th>Gerät</th>
                    <th>Problem/Arbeit</th>
                    <th>SN</th>
                </tr>
            </thead>
            <tbody id="wo-body">
                <!-- Keine Zeilen: Es wurden keine WO-Blöcke im bereitgestellten Input übergeben. -->
            </tbody>
        </table>
    </div>
</div>

<script>
    (function () {
        "use strict";

        // Eindeutiger Prefix (Liste/Generierung) – muss die Liste eindeutig machen
        var STORAGE_PREFIX = "WOIS:2026-02-04 20:37:";

        function isValidSecondPhone(p) {
            if (!p) return false;
            var s = String(p).trim();
            if (!s) return false;
            if (/^n\/a$/i.test(s)) return false;
            if (s === "+49") return false;
            // offensichtlich unvollständig: sehr kurz nach Entfernen nicht-Ziffern
            var digits = s.replace(/[^\d]/g, "");
            if (digits.length < 5) return false;
            return true;
        }

        function normalizePhoneForCompare(p) {
            if (!p) return "";
            return String(p).replace(/[^\d+]/g, "").trim();
        }

        function setupPersistenceForRow(wo) {
            var cb = document.getElementById("called-" + wo);
            var note = document.getElementById("note-" + wo);
            if (!cb || !note) return;

            var cbKey = STORAGE_PREFIX + "called:" + wo;
            var noteKey = STORAGE_PREFIX + "note:" + wo;

            // Restore
            var storedCb = localStorage.getItem(cbKey);
            if (storedCb !== null) cb.checked = (storedCb === "true");

            var storedNote = localStorage.getItem(noteKey);
            if (storedNote !== null) note.value = storedNote;

            // Save
            cb.addEventListener("change", function () {
                localStorage.setItem(cbKey, String(cb.checked));
            });

            note.addEventListener("input", function () {
                localStorage.setItem(noteKey, note.value);
            });
        }

        function fallbackCopyText(text) {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.top = "-9999px";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.focus();
            ta.select();

            try {
                document.execCommand("copy");
            } catch (e) {
                // swallow
            } finally {
                document.body.removeChild(ta);
            }
        }

        function copyToClipboard(text) {
            var t = (text == null) ? "" : String(text);
            if (!t.trim()) return;

            if (navigator && navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
                navigator.clipboard.writeText(t).catch(function () {
                    fallbackCopyText(t);
                });
            } else {
                fallbackCopyText(t);
            }
        }

        function shouldIgnoreClickTarget(target) {
            if (!target) return false;
            var tag = (target.tagName || "").toUpperCase();
            if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || tag === "BUTTON" || tag === "LABEL") return true;
            if (target.isContentEditable) return true;
            return false;
        }

        // Click-to-copy: überall in der Tabelle, außer Inputs/Labels/Buttons
        document.addEventListener("click", function (e) {
            var t = e.target;
            if (shouldIgnoreClickTarget(t)) return;

            // Nur innerhalb der Tabelle kopieren
            var inTable = t.closest && t.closest("table");
            if (!inTable) return;

            // Nicht Checkbox-Klick kaputtmachen: Label/Checkbox sind oben ausgeschlossen
            var text = "";
            if (t && typeof t.innerText === "string") {
                text = t.innerText.trim();
            } else if (t && typeof t.textContent === "string") {
                text = t.textContent.trim();
            }
            copyToClipboard(text);
        }, { passive: true });

        // Beispiel/Platzhalter: Falls später dynamisch Zeilen hinzugefügt werden,
        // kann man hier pro WO die Persistenz aktivieren.
        function initExistingRows() {
            var inputs = document.querySelectorAll('input[type="checkbox"][id^="called-"]');
            inputs.forEach(function (cb) {
                var wo = cb.id.replace(/^called-/, "");
                setupPersistenceForRow(wo);
            });
        }

        initExistingRows();
    })();
</script>
</body> </html>
